<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="100%" height="100%">
  <defs>
    <!-- Background & Glowing Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#0e0f13"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#331800" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ff5500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2a2b36" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="goldOrange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>

    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cfd4dc"/>
      <stop offset="100%" stop-color="#808896"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; }
    .term-key { fill: #ff7700; font-weight: 600; font-size: 13.5px; letter-spacing: 0.5px; }
    .term-val { fill: #d8dde6; font-size: 13.5px; }
    .term-dot { fill: #ff7700; font-weight: 900; }
    .badge-txt { fill: #b0b8c4; font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px; }
    .cursor { fill: #ff7700; animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- Outer Card Frame -->
  <rect x="5" y="5" width="940" height="340" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Left Futuristic Corner Circuit Lines -->
  <path d="M 5 60 L 60 5" stroke="#ff7700" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 5 90 L 90 5" stroke="#ff5500" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4,4" />
  <circle cx="60" cy="5" r="2.5" fill="#ff7700" />
  <circle cx="5" cy="60" r="2.5" fill="#ff7700" />

  <!-- Background Ambient Glow -->
  <circle cx="190" cy="140" r="80" fill="#ff5500" opacity="0.08" filter="url(#glowOrange)"/>
  <circle cx="650" cy="170" r="120" fill="#ff7700" opacity="0.04" filter="url(#glowOrange)"/>

  <!-- ==================== LEFT COLUMN: BRAND IDENTITY ==================== -->
  <g transform="translate(195, 125)">
    <!-- Swirling Orbital Ring -->
    <ellipse cx="0" cy="-2" rx="66" ry="24" fill="none" stroke="url(#goldOrange)" stroke-width="3" transform="rotate(-22)" filter="url(#softGlow)" opacity="0.95" />
    <ellipse cx="0" cy="-2" rx="66" ry="24" fill="none" stroke="#ffffff" stroke-width="1" transform="rotate(-22)" opacity="0.5" />

    <!-- Stylized "A" (Silver/Chrome) -->
    <path d="M -36 28 L -10 -36 L 4 -36 L -16 28 Z" fill="url(#silverWhite)" />
    <path d="M -4 28 L -10 -12 L 0 -12 L 14 28 Z" fill="url(#silverWhite)" />
    <polygon points="-24,6 4,6 -4,-6" fill="#121318" />

    <!-- Stylized "S" (Electric Neon Orange) -->
    <path d="M 6 -32 C 18 -38 38 -36 44 -26 C 48 -18 42 -10 32 -6 L 16 -1 C 4 3 0 10 2 18 C 5 28 20 34 36 30 C 44 27 48 23 48 23 L 42 34 C 42 34 32 39 18 38 C 2 37 -6 28 -4 16 C -2 4 8 -2 18 -6 L 34 -11 C 42 -14 44 -19 42 -24 C 40 -28 32 -31 22 -30 C 14 -29 8 -26 8 -26 Z" 
          fill="url(#goldOrange)" filter="url(#softGlow)" />
  </g>

  <!-- Typography: Name & Designation -->
  <text x="195" y="198" text-anchor="middle" class="font-sans" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="2.5">
    A.W.A. <tspan fill="#ff7700">SANDUN</tspan>
  </text>
  <text x="195" y="217" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c0c6d0" letter-spacing="6.5">
    WIJESINGHA
  </text>

  <!-- Divider lines -->
  <line x1="45" y1="228" x2="115" y2="228" stroke="#3a3d48" stroke-width="1"/>
  <line x1="275" y1="228" x2="345" y2="228" stroke="#3a3d48" stroke-width="1"/>

  <text x="195" y="243" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#9da5b4" letter-spacing="0.3">
    Software Engineer <tspan fill="#ff7700">|</tspan> Co-Founder <tspan fill="#ff7700">|</tspan> Technology Enthusiast
  </text>

  <!-- Tech Badges Pill Row -->
  <g transform="translate(68, 260)">
    <!-- Java -->
    <rect x="0" y="0" width="46" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="23" y="13.5" text-anchor="middle" class="font-sans badge-txt">Java</text>
    
    <!-- Python -->
    <rect x="52" y="0" width="56" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="80" y="13.5" text-anchor="middle" class="font-sans badge-txt">Python</text>

    <!-- Flutter -->
    <rect x="114" y="0" width="56" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="142" y="13.5" text-anchor="middle" class="font-sans badge-txt">Flutter</text>

    <!-- Database -->
    <rect x="176" y="0" width="66" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="209" y="13.5" text-anchor="middle" class="font-sans badge-txt">Database</text>

    <!-- Cloud -->
    <rect x="248" y="0" width="50" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="273" y="13.5" text-anchor="middle" class="font-sans badge-txt">Cloud</text>
  </g>


  <!-- ==================== RIGHT COLUMN: TERMINAL WINDOW ==================== -->
  <g transform="translate(370, 30)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="545" height="280" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.2"/>
    
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="5.5" fill="#27c93f"/>

    <!-- Terminal Title -->
    <text x="272" y="22" text-anchor="middle" class="font-mono" font-size="12" fill="#757c8a">~/sandun/about_me.yml</text>
    <line x1="0" y1="36" x2="545" y2="36" stroke="#22242d" stroke-width="1"/>

    <!-- Terminal Content (YAML Key-Values) -->
    <g transform="translate(26, 68)" class="font-mono">
      <!-- Row 1: Identity -->
      <text x="0" y="0" class="term-key">identity:</text>
      <text x="145" y="0" class="term-val" font-weight="600" fill="#ffffff">A.W.A. Sandun Wijesingha</text>

      <!-- Row 2: Designation -->
      <text x="0" y="26" class="term-key">designation:</text>
      <text x="145" y="26" class="term-val">Software Engineer <tspan fill="#ff7700">|</tspan> Co-Founder <tspan fill="#ff7700">|</tspan> Tech Enthusiast</text>

      <!-- Row 3: Institution -->
      <text x="0" y="52" class="term-key">institution:</text>
      <text x="145" y="52" class="term-val">Faculty of Computing, SLIIT</text>

      <!-- Row 4: Specializations -->
      <text x="0" y="78" class="term-key">specializations:</text>
      <text x="145" y="78" class="term-val">AI <tspan class="term-dot">&bull;</tspan> Machine Learning <tspan class="term-dot">&bull;</tspan> Full-Stack Architecture</text>

      <!-- Row 5: Core Pillars -->
      <text x="0" y="104" class="term-key">core_pillars:</text>
      <text x="145" y="104" class="term-val">Clean Code <tspan class="term-dot">&bull;</tspan> Scalable Systems <tspan class="term-dot">&bull;</tspan> Autonomous AI</text>
      <text x="145" y="122" class="term-val">Workflows</text>

      <!-- Row 6: Base -->
      <text x="0" y="148" class="term-key">base:</text>
      <text x="145" y="148" class="term-val">Colombo, Sri Lanka</text>

      <!-- Row 7: Status with Blinking Cursor -->
      <text x="0" y="174" class="term-key">status:</text>
      <text x="145" y="174" class="term-val">Open for collaborative engineering &amp;</text>
      <text x="145" y="192" class="term-val">high-impact ventures</text>
      <rect x="318" y="180" width="8" height="15" class="cursor" rx="1"/>
    </g>
  </g>

  <!-- ==================== BOTTOM MOTTO & SWOOSH ==================== -->
  <g transform="translate(475, 375)">
    <text text-anchor="middle" class="font-sans" font-size="13.5" font-style="italic" fill="#c0c7d4" letter-spacing="0.5">
      Building Innovative <tspan fill="#ff7700" font-weight="bold">Software Solutions</tspan> for a Better Tomorrow...
    </text>
    <!-- Dynamic curved glow swoosh -->
    <path d="M -160 10 Q -50 18 160 10" stroke="url(#goldOrange)" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#softGlow)"/>
  </g>
</svg>
