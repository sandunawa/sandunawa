<svg xmlns="http://www.w3.org/2000/svg" width="950" height="400" viewBox="0 0 950 400">
  <defs>
    <!-- Background & Glowing Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#0e0f13"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#331800" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ff5500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2a2b36" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="goldOrange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>

    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cfd4dc"/>
      <stop offset="100%" stop-color="#808896"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="5" y="5" width="940" height="340" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Left Futuristic Corner Circuit Lines -->
  <path d="M 5 60 L 60 5" stroke="#ff7700" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 5 90 L 90 5" stroke="#ff5500" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4,4" />
  <circle cx="60" cy="5" r="2.5" fill="#ff7700" />
  <circle cx="5" cy="60" r="2.5" fill="#ff7700" />

  <!-- ==================== LEFT COLUMN: BRAND IDENTITY ==================== -->
  <g transform="translate(195, 125)">
    <!-- Swirling Orbital Ring -->
    <ellipse cx="0" cy="-2" rx="66" ry="24" fill="none" stroke="url(#goldOrange)" stroke-width="3" transform="rotate(-22)" opacity="0.95" />
    <ellipse cx="0" cy="-2" rx="66" ry="24" fill="none" stroke="#ffffff" stroke-width="1" transform="rotate(-22)" opacity="0.5" />

    <!-- Stylized "A" (Silver/Chrome) -->
    <path d="M -36 28 L -10 -36 L 4 -36 L -16 28 Z" fill="url(#silverWhite)" />
    <path d="M -4 28 L -10 -12 L 0 -12 L 14 28 Z" fill="url(#silverWhite)" />
    <polygon points="-24,6 4,6 -4,-6" fill="#121318" />

    <!-- Stylized "S" (Electric Neon Orange) -->
    <path d="M 6 -32 C 18 -38 38 -36 44 -26 C 48 -18 42 -10 32 -6 L 16 -1 C 4 3 0 10 2 18 C 5 28 20 34 36 30 C 44 27 48 23 48 23 L 42 34 C 42 34 32 39 18 38 C 2 37 -6 28 -4 16 C -2 4 8 -2 18 -6 L 34 -11 C 42 -14 44 -19 42 -24 C 40 -28 32 -31 22 -30 C 14 -29 8 -26 8 -26 Z" 
          fill="url(#goldOrange)" />
  </g>

  <!-- Typography: Name & Designation -->
  <text x="195" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="2.5">
    A.W.A. <tspan fill="#ff7700">SANDUN</tspan>
  </text>
  <text x="195" y="217" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#c0c6d0" letter-spacing="6.5">
    WIJESINGHA
  </text>

  <!-- Divider lines -->
  <line x1="45" y1="228" x2="115" y2="228" stroke="#3a3d48" stroke-width="1"/>
  <line x1="275" y1="228" x2="345" y2="228" stroke="#3a3d48" stroke-width="1"/>

  <text x="195" y="243" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500" fill="#9da5b4">
    Software Engineer <tspan fill="#ff7700">|</tspan> Co-Founder <tspan fill="#ff7700">|</tspan> Technology Enthusiast
  </text>

  <!-- Tech Badges Pill Row -->
  <g transform="translate(68, 260)">
    <!-- Java -->
    <rect x="0" y="0" width="46" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="23" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#b0b8c4">Java</text>
    
    <!-- Python -->
    <rect x="52" y="0" width="56" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="80" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#b0b8c4">Python</text>

    <!-- Flutter -->
    <rect x="114" y="0" width="56" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="142" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#b0b8c4">Flutter</text>

    <!-- Database -->
    <rect x="176" y="0" width="66" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="209" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#b0b8c4">Database</text>

    <!-- Cloud -->
    <rect x="248" y="0" width="50" height="20" rx="10" fill="#15161c" stroke="#2c2e39" stroke-width="1"/>
    <text x="273" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#b0b8c4">Cloud</text>
  </g>


  <!-- ==================== RIGHT COLUMN: TERMINAL WINDOW ==================== -->
  <g transform="translate(370, 30)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="545" height="280" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.2"/>
    
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="5.5" fill="#27c93f"/>

    <!-- Terminal Title -->
    <text x="272" y="22" text-anchor="middle" font-family="Consolas,Fira Code,monospace" font-size="12" fill="#757c8a">~/sandun/about_me.yml</text>
    <line x1="0" y1="36" x2="545" y2="36" stroke="#22242d" stroke-width="1"/>

    <!-- Terminal Content (YAML Key-Values) -->
    <g transform="translate(26, 68)" font-family="Consolas,Fira Code,monospace" font-size="13.5">
      <!-- Row 1: Identity -->
      <text x="0" y="0" fill="#ff7700" font-weight="bold">identity:</text>
      <text x="145" y="0" fill="#ffffff" font-weight="bold">A.W.A. Sandun Wijesingha</text>

      <!-- Row 2: Designation -->
      <text x="0" y="26" fill="#ff7700" font-weight="bold">designation:</text>
      <text x="145" y="26" fill="#d8dde6">Software Engineer <tspan fill="#ff7700">|</tspan> Co-Founder <tspan fill="#ff7700">|</tspan> Tech Enthusiast</text>

      <!-- Row 3: Institution -->
      <text x="0" y="52" fill="#ff7700" font-weight="bold">institution:</text>
      <text x="145" y="52" fill="#d8dde6">Faculty of Computing, SLIIT</text>

      <!-- Row 4: Specializations -->
      <text x="0" y="78" fill="#ff7700" font-weight="bold">specializations:</text>
      <text x="145" y="78" fill="#d8dde6">AI <tspan fill="#ff7700">&bull;</tspan> Machine Learning <tspan fill="#ff7700">&bull;</tspan> Full-Stack Architecture</text>

      <!-- Row 5: Core Pillars -->
      <text x="0" y="104" fill="#ff7700" font-weight="bold">core_pillars:</text>
      <text x="145" y="104" fill="#d8dde6">Clean Code <tspan fill="#ff7700">&bull;</tspan> Scalable Systems <tspan fill="#ff7700">&bull;</tspan> Autonomous AI</text>
      <text x="145" y="122" fill="#d8dde6">Workflows</text>

      <!-- Row 6: Base -->
      <text x="0" y="148" fill="#ff7700" font-weight="bold">base:</text>
      <text x="145" y="148" fill="#d8dde6">Colombo, Sri Lanka</text>

      <!-- Row 7: Status with Blinking Cursor -->
      <text x="0" y="174" fill="#ff7700" font-weight="bold">status:</text>
      <text x="145" y="174" fill="#d8dde6">Open for collaborative engineering &amp;</text>
      <text x="145" y="192" fill="#d8dde6">high-impact ventures</text>
      <rect x="318" y="180" width="8" height="15" fill="#ff7700" rx="1"/>
    </g>
  </g>

  <!-- ==================== BOTTOM MOTTO & SWOOSH ==================== -->
  <g transform="translate(475, 375)">
    <text text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13.5" font-style="italic" fill="#c0c7d4">
      Building Innovative <tspan fill="#ff7700" font-weight="bold">Software Solutions</tspan> for a Better Tomorrow...
    </text>
    <!-- Dynamic curved glow swoosh -->
    <path d="M -160 10 Q -50 18 160 10" stroke="url(#goldOrange)" stroke-width="2.5" fill="none" opacity="0.9" />
  </g>
</svg>
